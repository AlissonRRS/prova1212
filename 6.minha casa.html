    <h1>Minha Casa</h1>
    <p>Essas informações ajudam a estimar quanto você consome.</p>

    <form>
        <label>Quantas pessoas moram na casa?
            <input type="number" min="1" value="1">
        </label>
        <br><br>

        <label>Cidade ou região: <input type="text"></label>
        <br><br>

        <label>Com que frequência você vai ao mercado?
            <select>
                <option>Toda semana</option>
                <option>A cada 15 dias</option>
                <option>Uma vez por mês</option>
            </select>
        </label>
        <br><br>

        <p>Você tem em casa:</p>
        <label><input type="checkbox"> Crianças</label><br>
        <label><input type="checkbox"> Pets</label><br>
        <label><input type="checkbox"> Alguém com dieta especial</label>
        <br><br>

        <button type="submit">Salvar</button>
    </form>
