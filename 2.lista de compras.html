    <h1>Lista de Compras</h1>
    <p>Itens que estão acabando, separados por categoria.</p>

    <h2>Essenciais</h2>
    <!-- <ul> = lista com bolinhas, <li> = cada item. A caixinha é um input do tipo checkbox. -->
    <ul>
        <li><label><input type="checkbox"> Leite (3 litros)</label></li>
        <li><label><input type="checkbox"> Arroz (5 kg)</label></li>
        <li><label><input type="checkbox"> Feijão (2 kg)</label></li>
    </ul>

    <h2>Frutas</h2>
    <ul>
        <li><label><input type="checkbox"> Banana (1 dúzia)</label></li>
        <li><label><input type="checkbox"> Mamão (1 unidade)</label></li>
    </ul>

    <h2>Limpeza</h2>
    <ul>
        <li><label><input type="checkbox"> Detergente (3 unidades)</label></li>
        <li><label><input type="checkbox"> Sabão em pó (1 caixa)</label></li>
    </ul>

    <h2>Adicionar item</h2>
    <form>
        <input type="text" placeholder="Ex: Tomate">
        <button type="submit">Adicionar</button>
    </form>
